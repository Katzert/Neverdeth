# M3 (swe_native_3d_v2) - ajustes de analisis del codegen ReXGlue.
#
# Capa 4 de 5 del manifest por capas (includes de neverdead_manifest.toml).
# Se fusiona con config/functions.toml (W1), config/vtables.toml (W2),
# config/crt.toml (W3) y config/invalid_instructions.toml (esta capa).
#
# Esquema verificado en el SDK instalado:
#   rexglue_sdk/win-amd64/include/rex/codegen/config.h  ->  RecompilerConfig
#     uint32_t maxJumpExtension      = 65536;
#     uint32_t dataRegionThreshold   = 16;
#     uint32_t largeFunctionThreshold= 1048576;   // 1 MiB
#     std::vector<uint32_t> exceptionHandlerFuncHints;
#   Llaves TOML verificadas en el binario del SDK:
#     rexglue_sdk/win-amd64/bin/rexglue.exe (strings)
#       'analysis.max_jump_extension', 'analysis.data_region_threshold',
#       'analysis.large_function_threshold', 'exception_handler_funcs',
#       'analysis'  (nombre de la tabla)
#
# MEDICIONES (guest = NeverDead_uncompressed.xex, imagen plana equivalente
# NeverDead_base.exe, base 0x82000000):
#   - .pdata: 5.895 extents (begin,unwind,end) big-endian de 12 B en 0x16F800.
#   - extension MAXIMA de un extent real = 12.160 B (0x2F80).
#   - extents > 65.536 B  = 0
#   - extents > 1.048.576 B = 0
#   - magic SEH 0x19930522 en la imagen invitada = 0 ocurrencias (BE y LE)
#
# Los tres valores numericos quedan en el DEFAULT del SDK porque la medicion
# demuestra que ninguna funcion real los necesita andersos. No se suben ni se
# bajan "a ojo": subir max_jump_extension sin evidencia solo enlargece el
# barrido y el riesgo de que el analizador se coma regiones de datos.
#
# NOTA sobre la ubicacion de `exception_handler_funcs`: en el binario del SDK
# la clave aparece SIN prefijo "analysis." (los tres escalares de abajo si
# llevan prefijo: 'analysis.max_jump_extension', 'analysis.data_region_threshold',
# 'analysis.large_function_threshold'), y se busca en la MISMA ranura de tabla
# que `is_dll`, que es una clave de primer nivel. Por eso va aqui, al nivel
# superior, y no dentro de [analysis]. Si el SDK la esperase dentro de
# [analysis], el efecto seria identico de todos modos: la lista esta VACIA.

[analysis]
# Bytes maximos que el analizador puede extender una funcion para alcanzar un
# destino de jump table. Default del SDK = 65536.
# Justificacion: la funcion real mas larga del invitado mide 12.160 B
# (12,4 KiB), casi 6x por debajo del default. Ningun extent de .pdata pasa de
# 65.536 B (0 de 5.895). Se mantiene el default.
max_jump_extension = 65536

# Numero de instrucciones INVALIDAS consecutivas antes de que el analizador
# marque la region como "embedded data". Default del SDK = 16.
# Justificacion: 16 instrucciones PPC de 32 bits = 64 B, que es exactamente el
# hueco de padding mas pequeno verificado en .rdata (64 B, VA 0x82007990). Con
# este default los huecos de padding NUL se detectan solos; los hints
# explicitos de config/invalid_instructions.toml cubren solo lo que el umbral
# NO alcanza (cadenas ASCII que casualmente decodifican como codigo PPC valido).
data_region_threshold = 16

# Umbral (en bytes) a partir del cual el codegen avisa de que una funcion es
# sospechosamente grande. Default del SDK = 1 MiB (1048576).
# Justificacion: 0 de los 5.895 extents de .pdata supera 1 MiB y el maximo real
# es 12.160 B, luego el aviso no puede dispararse con la extension actual.
large_function_threshold = 1048576

# Direcciones de funciones manejadoras de excepcion (SEH) del invitado.
# Justificacion: el invitado (XEX de Xbox 360) NO tiene SEH: el marcador
# magico de ExceptionHandler de MSVC (0x19930522) aparece 0 veces en toda la
# imagen invitada (busqueda big-endian y little-endian), y .pdata solo contiene
# los 3 campos (begin, unwind, end) sin tabla de scopes. Por tanto la lista
# debe quedar VACIA: anyadir hints aqui seria inventar semantica.
exception_handler_funcs = []
