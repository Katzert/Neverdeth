# ReXGlue codegen analysis thresholds.
#
# Measured against the retail guest .pdata section:
#   - 5,895 extents (begin, unwind, end)
#   - Maximum extent size: 12,160 bytes (0x2F80)
#   - Extents > 65,536 bytes: 0
#   - Extents > 1,048,576 bytes: 0
#   - MSVC SEH magic (0x19930522): 0 occurrences
#
# All numeric thresholds remain at SDK defaults to avoid over-extending
# function scans into adjacent data regions.

[analysis]
# Maximum bytes the analyzer may extend a function to reach a jump-table target.
max_jump_extension = 65536

# Consecutive invalid PPC instructions required before marking a region as
# embedded data (16 * 4 = 64 bytes, matching the smallest NUL padding gap in .rdata).
data_region_threshold = 16

# Byte threshold above which codegen warns about unusually large functions (1 MiB).
large_function_threshold = 1048576

# Guest SEH handler addresses (empty; Xbox 360 image has no SEH scope tables).
exception_handler_funcs = []
